<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" style="font-family: system-ui, -apple-system, sans-serif; background-color: #ffffff;">
  <defs>
    <style>
      .room { fill: #f8f9fa; stroke: #333333; stroke-width: 2; rx: 6; }
      .restricted-badge { fill: #fff9db; stroke: #e67700; stroke-width: 2; stroke-dasharray: 6,4; rx: 6; }
      .restricted-vault { fill: #ffe3e3; stroke: #c92a2a; stroke-width: 2.5; rx: 6; }
      .current-loc { fill: #e7f5ff; stroke: #1864ab; stroke-width: 3.5; rx: 6; }
      .connector { stroke: #444444; stroke-width: 3; }
      .label { font-size: 14px; font-weight: 600; fill: #212529; text-anchor: middle; dominant-baseline: middle; }
      .sublabel { font-size: 11px; font-weight: 500; fill: #495057; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Horizontal Connectors (Row 1: y=50, Row 2: y=170, Row 3: y=290) -->
  <line x1="200" y1="50" x2="240" y2="50" class="connector" />
  <line x1="420" y1="50" x2="460" y2="50" class="connector" />
  <line x1="640" y1="50" x2="680" y2="50" class="connector" />

  <line x1="200" y1="170" x2="240" y2="170" class="connector" />
  <line x1="420" y1="170" x2="460" y2="170" class="connector" />
  <line x1="640" y1="170" x2="680" y2="170" class="connector" />

  <line x1="200" y1="290" x2="240" y2="290" class="connector" />
  <line x1="420" y1="290" x2="460" y2="290" class="connector" />
  <line x1="640" y1="290" x2="680" y2="290" class="connector" />

  <!-- Vertical Connectors (Col 1: x=110, Col 2: x=330, Col 3: x=550, Col 4: x=770) -->
  <line x1="110" y1="80" x2="110" y2="140" class="connector" />
  <line x1="110" y1="200" x2="110" y2="260" class="connector" />

  <line x1="330" y1="80" x2="330" y2="140" class="connector" />
  <line x1="330" y1="200" x2="330" y2="260" class="connector" />

  <line x1="550" y1="80" x2="550" y2="140" class="connector" />
  <line x1="550" y1="200" x2="550" y2="260" class="connector" />

  <line x1="770" y1="80" x2="770" y2="140" class="connector" />
  <line x1="770" y1="200" x2="770" y2="260" class="connector" />

  <!-- Row 1 -->
  <rect x="20" y="20" width="180" height="60" class="room" />
  <text x="110" y="50" class="label">Archive</text>

  <rect x="240" y="20" width="180" height="60" class="room" />
  <text x="330" y="50" class="label">Executive Office</text>

  <rect x="460" y="20" width="180" height="60" class="room" />
  <text x="550" y="50" class="label">Conference Room</text>

  <rect x="680" y="20" width="180" height="60" class="room" />
  <text x="770" y="50" class="label">Roof</text>

  <!-- Row 2 -->
  <rect x="20" y="140" width="180" height="60" class="room" />
  <text x="110" y="170" class="label">Help Desk</text>

  <rect x="240" y="140" width="180" height="60" class="room" />
  <text x="330" y="170" class="label">Security Office</text>

  <rect x="460" y="140" width="180" height="60" class="room" />
  <text x="550" y="170" class="label">Server Room</text>

  <rect x="680" y="140" width="180" height="60" class="restricted-badge" />
  <text x="770" y="163" class="label">Network Closet</text>
  <text x="770" y="181" class="sublabel">(restricted: badge)</text>

  <!-- Row 3 -->
  <rect x="20" y="260" width="180" height="60" class="current-loc" />
  <text x="110" y="283" class="label">Parking Garage</text>
  <text x="110" y="301" class="sublabel">(you are here)</text>

  <rect x="240" y="260" width="180" height="60" class="room" />
  <text x="330" y="290" class="label">Lobby</text>

  <rect x="460" y="260" width="180" height="60" class="room" />
  <text x="550" y="290" class="label">Break Room</text>

  <rect x="680" y="260" width="180" height="60" class="restricted-vault" />
  <text x="770" y="283" class="label">Vault</text>
  <text x="770" y="301" class="sublabel">(restricted: vault key)</text>
</svg>
